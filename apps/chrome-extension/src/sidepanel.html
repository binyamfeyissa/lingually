<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lingually Side Panel</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #030712;
      color: #f3f4f6;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 13px;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      box-sizing: border-box;
    }
    header {
      padding: 12px 16px;
      background: #090d16;
      border-bottom: 1px solid #1e293b;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .logo-badge {
      width: 22px;
      height: 22px;
      border-radius: 6px;
      background: linear-gradient(135deg, #6366f1, #a855f7);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 11px;
      font-weight: bold;
    }
    .score-badge {
      font-size: 11px;
      font-weight: 700;
      color: #10b981;
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.3);
      padding: 2px 8px;
      border-radius: 9999px;
    }
    .nav-tabs {
      display: flex;
      border-bottom: 1px solid #1e293b;
      background: #0f172a;
    }
    .nav-tab {
      flex: 1;
      padding: 10px 4px;
      text-align: center;
      font-size: 11px;
      font-weight: 600;
      color: #94a3b8;
      background: transparent;
      border: none;
      border-bottom: 2px solid transparent;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .nav-tab.active {
      color: #818cf8;
      border-bottom-color: #6366f1;
      background: rgba(99, 102, 241, 0.05);
    }
    .content-area {
      flex: 1;
      overflow-y: auto;
      padding: 14px;
    }
    .input-box {
      width: 100%;
      height: 100px;
      background: #090d16;
      border: 1px solid #334155;
      border-radius: 8px;
      color: #f8fafc;
      font-family: inherit;
      font-size: 12px;
      padding: 10px;
      box-sizing: border-box;
      resize: vertical;
      margin-bottom: 12px;
    }
    .input-box:focus {
      outline: none;
      border-color: #6366f1;
    }
    .btn {
      width: 100%;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
      box-sizing: border-box;
      border: none;
    }
    .btn-primary {
      background: #6366f1;
      color: white;
    }
    .btn-primary:hover {
      background: #4f46e5;
    }
    .btn-secondary {
      background: #1e293b;
      color: #cbd5e1;
      border: 1px solid #334155;
      margin-top: 6px;
    }
    .btn-secondary:hover {
      background: #334155;
      color: white;
    }
    .suggestion-card {
      background: #090d16;
      border: 1px solid #1e293b;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 10px;
      transition: border-color 0.15s ease;
    }
    .suggestion-card:hover {
      border-color: #334155;
    }
    .card-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }
    .pill {
      font-size: 9px;
      font-weight: 700;
      text-transform: uppercase;
      padding: 2px 6px;
      border-radius: 9999px;
    }
    .pill-correctness { background: rgba(244, 63, 94, 0.15); color: #fb7185; }
    .pill-clarity { background: rgba(14, 165, 233, 0.15); color: #38bdf8; }
    .pill-engagement { background: rgba(16, 185, 129, 0.15); color: #34d399; }
    .pill-delivery { background: rgba(139, 92, 246, 0.15); color: #a78bfa; }
    .card-diff {
      font-family: monospace;
      font-size: 11px;
      background: #030712;
      padding: 6px 8px;
      border-radius: 6px;
      margin: 6px 0;
      display: flex;
      gap: 6px;
    }
    .empty-state {
      text-align: center;
      padding: 40px 16px;
      color: #64748b;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <div class="logo-badge">L</div>
      <span style="font-weight: 700; font-size: 13px;">Lingually Review</span>
    </div>
    <div id="sidepanel-score" class="score-badge">100/100</div>
  </header>

  <div class="nav-tabs">
    <button class="nav-tab active" data-tab="tab-suggestions">Suggestions</button>
    <button class="nav-tab" data-tab="tab-ai">Generative AI</button>
    <button class="nav-tab" data-tab="tab-plagiarism">Plagiarism</button>
  </div>

  <div class="content-area">
    <textarea id="sidepanel-input" class="input-box" placeholder="Select text on the page or paste text here to review..."></textarea>
    
    <div style="display: flex; gap: 6px; margin-bottom: 12px;">
      <button id="btn-run-check" class="btn btn-primary" style="flex: 1;">Check Text</button>
      <button id="btn-fetch-selection" class="btn btn-secondary" style="flex: 1; margin-top: 0;">Get Page Selection</button>
    </div>

    <!-- Tab 1: Suggestions -->
    <div id="tab-suggestions" class="tab-pane">
      <div id="suggestions-list">
        <div class="empty-state">No issues detected yet. Type or paste text above to run the review engine.</div>
      </div>
    </div>

    <!-- Tab 2: Generative AI -->
    <div id="tab-ai" class="tab-pane" style="display: none;">
      <div style="display: flex; flex-direction: column; gap: 8px;">
        <label style="font-size: 11px; font-weight: 600; color: #94a3b8;">Transform Selection</label>
        <button id="tool-improve" class="btn btn-secondary">✨ Full AI Improvement</button>
        <button id="tool-paraphrase" class="btn btn-secondary">🔄 Paraphrase & Rewrite</button>
        <button id="tool-concise" class="btn btn-secondary">✂️ Make Concise</button>
        <button id="tool-formal" class="btn btn-secondary">👔 Formal Tone</button>
        <button id="tool-casual" class="btn btn-secondary">💬 Casual Tone</button>
      </div>
      <div id="ai-result-box" style="margin-top: 14px; display: none;">
        <label style="font-size: 11px; font-weight: 600; color: #94a3b8;">AI Output</label>
        <div id="ai-result-text" style="background: #090d16; border: 1px solid #1e293b; padding: 10px; border-radius: 8px; font-size: 12px; margin-top: 6px; white-space: pre-wrap;"></div>
        <button id="btn-copy-ai" class="btn btn-primary" style="margin-top: 8px;">Copy to Clipboard</button>
      </div>
    </div>

    <!-- Tab 3: Plagiarism -->
    <div id="tab-plagiarism" class="tab-pane" style="display: none;">
      <div style="background: #090d16; border: 1px solid #1e293b; border-radius: 8px; padding: 12px; margin-bottom: 12px;">
        <div style="font-size: 11px; font-weight: 600; color: #94a3b8;">Plagiarism & AI Text Verification</div>
        <div style="font-size: 24px; font-weight: 800; color: #10b981; margin: 8px 0;">0% Match</div>
        <div style="font-size: 11px; color: #64748b;">Text analyzed against n-gram corpus and attribution benchmarks. 100% original.</div>
      </div>
    </div>
  </div>

  <script src="sidepanel.js"></script>
</body>
</html>
