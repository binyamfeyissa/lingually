<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lingually Writing Assistant</title>
  <style>
    body {
      margin: 0;
      padding: 16px;
      width: 300px;
      background: #090d16;
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      box-sizing: border-box;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid #1e293b;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .logo-badge {
      width: 24px;
      height: 24px;
      border-radius: 6px;
      background: linear-gradient(135deg, #6366f1, #a855f7);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 13px;
      font-weight: bold;
    }
    .title {
      font-size: 14px;
      font-weight: 700;
    }
    .version {
      font-size: 10px;
      color: #818cf8;
      background: rgba(99, 102, 241, 0.15);
      padding: 1px 6px;
      border-radius: 10px;
      margin-left: 4px;
    }
    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 12px;
    }
    .toggle-label {
      font-size: 13px;
      font-weight: 600;
    }
    .toggle-sub {
      font-size: 11px;
      color: #94a3b8;
      margin-top: 2px;
    }
    .switch {
      position: relative;
      display: inline-block;
      width: 40px;
      height: 22px;
    }
    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: #334155;
      transition: .2s;
      border-radius: 22px;
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 16px;
      width: 16px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .2s;
      border-radius: 50%;
    }
    input:checked + .slider {
      background-color: #6366f1;
    }
    input:checked + .slider:before {
      transform: translateX(18px);
    }
    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 9px 12px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
      box-sizing: border-box;
      text-decoration: none;
    }
    .btn-primary {
      background: #6366f1;
      color: white;
      border: none;
    }
    .btn-primary:hover {
      background: #4f46e5;
    }
    .btn-secondary {
      background: #1e293b;
      color: #cbd5e1;
      border: 1px solid #334155;
    }
    .btn-secondary:hover {
      background: #334155;
      color: white;
    }
    .footer {
      margin-top: 14px;
      text-align: center;
      font-size: 11px;
      color: #64748b;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">
      <div class="logo-badge">L</div>
      <span class="title">Lingually</span>
      <span class="version">v2.0</span>
    </div>
  </div>

  <div class="toggle-row">
    <div>
      <div class="toggle-label">Writing Assistant</div>
      <div class="toggle-sub">Inline check & highlights</div>
    </div>
    <label class="switch">
      <input type="checkbox" id="toggle-enabled" checked>
      <span class="slider"></span>
    </label>
  </div>

  <div class="btn-group">
    <button id="btn-sidepanel" class="btn btn-primary">📖 Open Writing Side Panel</button>
    <button id="btn-editor" class="btn btn-secondary">🌐 Open Web Workbench</button>
    <button id="btn-options" class="btn btn-secondary">⚙️ Provider & Key Settings</button>
  </div>

  <div class="footer">
    100% Open Source • Local-First BYOK
  </div>

  <script src="popup.js"></script>
</body>
</html>
